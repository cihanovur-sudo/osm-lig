<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oyun</title>
    <style>
        /* CSS / Tasarım Ayarları (Değiştirilmedi) */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        .oyun-alani {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #007bff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="oyun-alani">
        <h2>Oyun Ekranı</h2>
        <button id="oyunButonu">Oynat / Başlat</button>
    </div>

    <script>
        // Sayfa DOM yapısı tamamen yüklendikten sonra çalışır
        document.addEventListener('DOMContentLoaded', () => {
            const buton = document.querySelector('#oyunButonu');

            if (buton) {
                buton.addEventListener('click', (e) => {
                    e.preventDefault(); // Varsayılan tıklama davranışını güvenle engeller
                    oyunuBaslat();
                });
            } else {
                console.error("Buton bulunamadı! Lütfen ID'yi kontrol edin.");
            }
        });

        // Oyun Mantığı (İçerik ve Kurallar Korundu)
        function oyunuBaslat() {
            alert("Buton çalışıyor! Oyun başlatıldı.");
            // Mevcut oyun fonksiyonlarınız buraya devam eder
        }
    </script>

</body>
</html>
