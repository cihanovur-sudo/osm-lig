<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BimSüperlig - Online Menajerlik</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; margin: 0; padding: 15px; }
    .card { background: #1e1e1e; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #333; }
    h2, h3, h4 { color: #4caf50; margin-top: 0; }
    input, select, button { width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px; border: 1px solid #444; background: #222; color: #fff; }
    button { background: #4caf50; font-weight: bold; cursor: pointer; border: none; }
    button:hover { background: #45a049; }
    button.danger { background: #f44336; }
    
    /* Saha ve Sürükle Bırak */
    .pitch { background: #2e7d32; border: 2px solid #fff; height: 260px; border-radius: 8px; position: relative; margin: 10px 0; }
    .slot { position: absolute; width: 90px; height: 45px; background: rgba(0,0,0,0.6); border: 2px dashed #fff; border-radius: 5px; text-align: center; font-size: 11px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .slot-kl { bottom: 10px; left: calc(50% - 45px); }
    .slot-def { bottom: 75px; left: calc(50% - 45px); }
    .slot-os { top: 75px; left: calc(50% - 45px); }
    .slot-for { top: 10px; left: calc(50% - 45px); }
    
    .player-card { background: #333; padding: 8px; border-radius: 4px; margin: 4px 0; cursor: grab; font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
    .player-list { max-height: 200px; overflow-y: auto; background: #181818; padding: 8px; border-radius: 5px; }
    
    .slider-val { font-weight: bold; color: #4caf50; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: center; }
    th, td { border: 1px solid #333; padding: 6px; }
    th { background: #252525; color: #4caf50; }
  </style>
</head>
<body>

  <!-- LOBİ / TAKIM GİRİŞİ -->
  <div class="card" id="sec-login">
    <h2>BimSüperlig'e Katıl (Maksimum 6 Takım)</h2>
    <p style="font-size: 12px; color: #aaa;">Lige katılmak için takım adınızı girin.</p>
    <input type="text" id="in-team-name" placeholder="Takım Adınızı Yazın...">
    <button onclick="takimKaydet()">Lige Katıl</button>
  </div>

  <!-- ANA OYUN EKRANI -->
  <div id="sec-game" style="display:none;">
    
    <!-- SAHA VE KADRO DİZİLİŞİ -->
    <div class="card">
      <h2 id="disp-team-name">Takımım</h2>
      <p style="font-size:12px; color:#aaa;">Oyuncuları kutulara sürükleyip bırakarak 4'lü ilk 11'inizi kurun.</p>
      
      <div class="pitch">
        <div class="slot slot-for" id="slot-FOR" ondrop="drop(event, 'FOR')" ondragover="allowDrop(event)">FORVET</div>
        <div class="slot slot-os" id="slot-OS" ondrop="drop(event, 'OS')" ondragover="allowDrop(event)">ORTA SAHA</div>
        <div class="slot slot-def" id="slot-DEF" ondrop="drop(event, 'DEF')" ondragover="allowDrop(event)">DEFANS</div>
        <div class="slot slot-kl" id="slot-KL" ondrop="drop(event, 'KL')" ondragover="allowDrop(event)">KALECİ</div>
      </div>
    </div>

    <!-- 16 OYUNCULU KADRO YÖNETİMİ -->
    <div class="card">
      <h3>Kadro Yönetimi (<span id="player-count">0</span>/16)</h3>
      <div class="player-list" id="squad-container"></div>

      <h4 style="margin-top:15px;">Yeni Oyuncu Ekle</h4>
      <input type="text" id="p-name" placeholder="Oyuncu Adı (Örn: Burak Yılmaz)">
      <input type="number" id="p-ovr" placeholder="Mevcut Overall (Örn: 80)">
      <input type="number" id="p-pot" placeholder="Potansiyel (Örn: 87)">
      <button onclick="oyuncuEkle()">Oyuncu Ekle</button>
    </div>

    <!-- TAKTİKLER -->
    <div class="card">
      <h3>Maç Taktikleri</h3>
      <label>Oyun Stili:</label>
      <select id="t-style" onchange="taktikKaydet()">
        <option value="pas">Paslaşarak Oyun</option>
        <option value="kontra">Hızlı Kontra Atak</option>
        <option value="uzun">Uzun Top / Bocalama</option>
      </select>

      <div style="margin-top:10px;">
        <label>Baskı: <span id="v-baski" class="slider-val">50%</span></label>
        <input type="range" id="r-baski" min="0" max="100" value="50" oninput="updateSlider('baski')">
      </div>
      <div>
        <label>Stil (Hücum/Savunma): <span id="v-stil" class="slider-val">50%</span></label>
        <input type="range" id="r-stil" min="0" max="100" value="50" oninput="updateSlider('stil')">
      </div>
      <div>
        <label>Tempo: <span id="v-tempo" class="slider-val">50%</span></label>
        <input type="range" id="r-tempo" min="0" max="100" value="50" oninput="updateSlider('tempo')">
      </div>
    </div>

    <!-- FİKSTÜR VE PUAN DURUMU -->
    <div class="card">
      <h3>Lig Puan Durumu</h3>
      <table>
        <thead>
          <tr><th>Takım</th><th>O</th><th>G</th><th>B</th><th>M</th><th>AG</th><th>YG</th><th>AV</th><th>P</th></tr>
        </thead>
        <tbody id="league-table"></tbody>
      </table>
    </div>

  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // FIREBASE ENTEGRASYONU
    const firebaseConfig = {
      apiKey: "AIzaSyAQin6wcbsZ1leZCAFE6NfncSjEhg9ntIg",
      authDomain: "bimsuperlig.firebaseapp.com",
      databaseURL: "https://bimsuperlig-default-rtdb.firebaseio.com",
      projectId: "bimsuperlig",
      storageBucket: "bimsuperlig.firebasestorage.app",
      messagingSenderId: "451832283043",
      appId: "1:451832283043:web:914a7c63b6d77ddaa72416"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myTeamId = localStorage.getItem('myTeamId') || null;
    let squad = [];

    function updateSlider(type) {
      const val = document.getElementById('r-' + type).value;
      document.getElementById('v-' + type).innerText = val + '%';
      taktikKaydet();
    }

    // Lige Katılma
    function takimKaydet() {
      const name = document.getElementById('in-team-name').value.trim();
      if (!name) return alert('Lütfen bir takım adı girin!');

      db.ref('teams').once('value', snapshot => {
        const teams = snapshot.val() || {};
        if (Object.keys(teams).length >= 6) return alert('Lig dolu! Maksimum 6 takım katılabilir.');

        const newRef = db.ref('teams').push();
        myTeamId = newRef.key;
        localStorage.setItem('myTeamId', myTeamId);

        newRef.set({
          name: name,
          pts: 0, o: 0, g: 0, b: 0, m: 0, ag: 0, yg: 0, av: 0,
          tactics: { baski: 50, stil: 50, tempo: 50, style: 'pas' },
          squad: []
        }).then(() => {
          initGame(name);
        });
      });
    }

    // Oyuncu Ekleme (Maksimum 16)
    function oyuncuEkle() {
      if (squad.length >= 16) return alert('Kadro limiti dolu! (Maksimum 16 oyuncu)');
      const name = document.getElementById('p-name').value.trim();
      const ovr = parseInt(document.getElementById('p-ovr').value);
      const pot = parseInt(document.getElementById('p-pot').value);

      if (!name || !ovr || !pot) return alert('Lütfen tüm bilgileri girin!');
      if (ovr > pot) return alert('Mevcut overall potansiyelden büyük olamaz!');

      const newPlayer = { id: Date.now(), name, ovr, pot, form: 100 };
      squad.push(newPlayer);
      db.ref(`teams/${myTeamId}/squad`).set(squad);

      document.getElementById('p-name').value = '';
      document.getElementById('p-ovr').value = '';
      document.getElementById('p-pot').value = '';
      renderSquad();
    }

    // Oyuncu Silme
    function oyuncuSil(id) {
      squad = squad.filter(p => p.id !== id);
      db.ref(`teams/${myTeamId}/squad`).set(squad);
      renderSquad();
    }

    // Kadroyu Listeleme
    function renderSquad() {
      const container = document.getElementById('squad-container');
      document.getElementById('player-count').innerText = squad.length;
      container.innerHTML = '';

      squad.forEach(p => {
        const el = document.createElement('div');
        el.className = 'player-card';
        el.draggable = true;
        el.ondragstart = (e) => e.dataTransfer.setData("text", JSON.stringify(p));
        el.innerHTML = `
          <span><b>${p.name}</b> (OVR: ${p.ovr} / POT: ${p.pot}) - Form: %${p.form}</span>
          <button class="danger" style="width:auto; padding:3px 8px;" onclick="oyuncuSil(${p.id})">Sil</button>
        `;
        container.appendChild(el);
      });
    }

    // Drag & Drop İşlemleri
    function allowDrop(ev) { ev.preventDefault(); }
    function drop(ev, pos) {
      ev.preventDefault();
      const data = JSON.parse(ev.dataTransfer.getData("text"));
      document.getElementById(`slot-${pos}`).innerText = `${pos}: ${data.name} (${data.ovr})`;
    }

    // Taktik Kaydetme
    function taktikKaydet() {
      if (!myTeamId) return;
      db.ref(`teams/${myTeamId}/tactics`).set({
        baski: document.getElementById('r-baski').value,
        stil: document.getElementById('r-stil').value,
        tempo: document.getElementById('r-tempo').value,
        style: document.getElementById('t-style').value
      });
    }

    // Oyunu Çalıştırma
    function initGame(teamName) {
      document.getElementById('sec-login').style.display = 'none';
      document.getElementById('sec-game').style.display = 'block';
      document.getElementById('disp-team-name').innerText = teamName;
      
      // Canlı Puan Tablosu Dinleyicisi
      db.ref('teams').on('value', snapshot => {
        const teams = snapshot.val() || {};
        const table = document.getElementById('league-table');
        table.innerHTML = '';
        
        let sortedTeams = Object.values(teams).sort((a,b) => b.pts - a.pts || b.av - a.av);

        sortedTeams.forEach(t => {
          table.innerHTML += `
            <tr>
              <td><b>${t.name}</b></td>
              <td>${t.o}</td>
              <td>${t.g}</td>
              <td>${t.b}</td>
              <td>${t.m}</td>
              <td>${t.ag}</td>
              <td>${t.yg}</td>
              <td>${t.av}</td>
              <td><b>${t.pts}</b></td>
            </tr>`;
        });
      });
    }

    // Sayfa Yenilendiğinde Oturum Kontrolü
    if (myTeamId) {
      db.ref(`teams/${myTeamId}`).once('value', snapshot => {
        if (snapshot.exists()) {
          squad = snapshot.val().squad || [];
          initGame(snapshot.val().name);
          renderSquad();
        }
      });
    }
  </script>
</body>
</html>
